name: Build SpotifyAlarm IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_16.0.app || xcode-select -p

      - name: Build Application (.app)
        run: |
          xcodebuild \
            -project SpotifyAlarm/SpotifyAlarm.xcodeproj \
            -scheme SpotifyAlarm \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            clean build

      - name: Package into IPA
        run: |
          APP_PATH=$(find build -name "SpotifyAlarm.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: SpotifyAlarm.app not found!"
            exit 1
          fi
          echo "Found compiled app at: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r SpotifyAlarm.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyAlarm-ipa
          path: SpotifyAlarm.ipa
          retention-days: 14
