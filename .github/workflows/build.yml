name: Build SpotifyAlarm IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_16.0.app || xcode-select -p

      - name: Build Application (.app)
        run: |
          xcodebuild \
            -project SpotifyAlarm/SpotifyAlarm.xcodeproj \
            -scheme SpotifyAlarm \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SpotifyAlarm.app Payload/
          zip -r SpotifyAlarm.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyAlarm-ipa
          path: SpotifyAlarm.ipa
          retention-days: 14
